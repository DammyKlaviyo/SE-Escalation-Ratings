<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #2c3e50;
    }
    .config-section {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #2c3e50;
      font-size: 12px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #2980b9;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    .info {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
    }
    .history-section {
      margin-top: 20px;
      border-top: 1px solid #e0e0e0;
      padding-top: 15px;
    }
    .history-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .history-section-header h2 {
      font-size: 14px;
      margin: 0;
      color: #2c3e50;
    }
    .view-all-ratings {
      font-size: 12px;
      font-weight: 600;
      color: #3498db;
      text-decoration: none;
      white-space: nowrap;
    }
    .view-all-ratings:hover {
      text-decoration: underline;
    }
    .view-all-ratings[hidden] {
      display: none !important;
    }
    #rating-history {
      max-height: 280px;
      overflow-y: auto;
      font-size: 12px;
    }
    .history-item {
      padding: 8px 10px;
      margin-bottom: 6px;
      background: #f8f9fa;
      border-radius: 4px;
      border-left: 3px solid #3498db;
    }
    .history-item.rating-bad { border-left-color: #e74c3c; }
    .history-item.rating-okay { border-left-color: #f39c12; }
    .history-item.rating-good { border-left-color: #27ae60; }
    .history-item__meta {
      color: #666;
      margin-bottom: 2px;
    }
    .history-item__link {
      color: #3498db;
      text-decoration: none;
      word-break: break-all;
    }
    .history-item__link:hover { text-decoration: underline; }
    .history-loading, .history-empty, .history-error {
      padding: 12px;
      text-align: center;
      color: #666;
      font-size: 12px;
    }
    .history-error { color: #e74c3c; }
    #history-refresh {
      margin-top: 8px;
      padding: 6px 12px;
      font-size: 12px;
      background: #ecf0f1;
      color: #2c3e50;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #history-refresh:hover { background: #ddd; }
  </style>
</head>
<body>
  <h1>Zendesk Escalation Rater</h1>
  <div class="config-section">
    <label for="script-url">Google Apps Script URL:</label>
    <input type="text" id="script-url" placeholder="https://script.google.com/macros/s/...">
    <div class="info">Enter the URL of your deployed Google Apps Script web app</div>
  </div>
  <button id="save-btn">Save Configuration</button>
  <div id="status" class="status"></div>

  <div class="history-section">
    <div class="history-section-header">
      <h2>Rating history</h2>
      <a id="view-all-ratings" class="view-all-ratings" target="_blank" rel="noopener" hidden>View all ratings</a>
    </div>
    <div id="rating-history"></div>
    <button type="button" id="history-refresh">Refresh</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
